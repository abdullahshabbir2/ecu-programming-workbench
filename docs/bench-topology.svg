<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="#29b8aa"/></marker></defs><rect width="1200" height="470" rx="18" fill="#0b2133"/><g font-family="Arial,sans-serif"><text x="32" y="46" font-size="28" font-weight="bold" fill="white">Virtual bench topology</text><text x="32" y="76" font-size="16" fill="#b0c9da">All connections below are software interfaces, not electrical wiring</text><rect x="32.0" y="110" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="48.0" y="145" font-size="19" font-weight="bold" fill="white">Tester endpoint</text><text x="48.0" y="173" font-size="14" fill="#c0d4e2">TX 0x700 / RX 0x708</text><text x="48.0" y="195" font-size="14" fill="#c0d4e2">Recorded CAN and UDS traces</text><path d="M393.6666666666667 164 h23" stroke="#29b8aa" stroke-width="2.5" marker-end="url(#a)"/><rect x="420.6666666666667" y="110" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="436.6666666666667" y="145" font-size="19" font-weight="bold" fill="white">Virtual CAN link</text><text x="436.6666666666667" y="173" font-size="14" fill="#c0d4e2">Classical eight-byte frames</text><text x="436.6666666666667" y="195" font-size="14" fill="#c0d4e2">One-millisecond scheduler</text><path d="M782.3333333333334 164 h23" stroke="#29b8aa" stroke-width="2.5" marker-end="url(#a)"/><rect x="809.3333333333334" y="110" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="825.3333333333334" y="145" font-size="19" font-weight="bold" fill="white">ECU endpoint</text><text x="825.3333333333334" y="173" font-size="14" fill="#c0d4e2">RX 0x700 / TX 0x708</text><text x="825.3333333333334" y="195" font-size="14" fill="#c0d4e2">Stateful diagnostic server</text><rect x="32.0" y="265" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="48.0" y="300" font-size="19" font-weight="bold" fill="white">Injected conditions</text><text x="48.0" y="328" font-size="14" fill="#c0d4e2">Engine RPM / supply voltage</text><text x="48.0" y="350" font-size="14" fill="#c0d4e2">Dropped frame or acknowledgement</text><path d="M393.6666666666667 319 h23" stroke="#29b8aa" stroke-width="2.5" marker-end="url(#a)"/><rect x="420.6666666666667" y="265" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="436.6666666666667" y="300" font-size="19" font-weight="bold" fill="white">Inactive-bank transaction</text><text x="436.6666666666667" y="328" font-size="14" fill="#c0d4e2">Staging and integrity checks</text><text x="436.6666666666667" y="350" font-size="14" fill="#c0d4e2">No active-bank overwrite</text><path d="M782.3333333333334 319 h23" stroke="#29b8aa" stroke-width="2.5" marker-end="url(#a)"/><rect x="809.3333333333334" y="265" width="358.6666666666667" height="108" rx="10" fill="#163b54" stroke="#37728a"/><text x="825.3333333333334" y="300" font-size="19" font-weight="bold" fill="white">Restart model</text><text x="825.3333333333334" y="328" font-size="14" fill="#c0d4e2">Reopen filesystem bank store</text><text x="825.3333333333334" y="350" font-size="14" fill="#c0d4e2">Validate committed image identity</text><text x="32" y="450" font-size="14" fill="#b0c9da">Implemented software model ? no physical ECU or OEM firmware represented</text></g></svg>