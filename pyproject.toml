[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecu-programming-workbench"
version = "1.0.0"
description = "Virtual CAN/ISO-TP and UDS programming validation for an owned ECU model"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "Abdullah Shabbir"}]
license = {file = "LICENSE"}

[project.scripts]
ecu-workbench = "workbench.__main__:main"

[tool.setuptools]
packages = ["workbench"]
